services:
  db:
    image: postgres:16-alpine
    container_name: ceap_postgres
    restart: unless-stopped
    command: postgres -c wal_level=logical -c max_replication_slots=5 -c max_wal_senders=5
    environment:
      POSTGRES_DB: ceap_oltp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ceap_oltp"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - ceap_network

  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    container_name: ceap_ingestion
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ceap_oltp
      DB_USER: postgres
      DB_PASSWORD: postgres
      ANOS: "2023,2024,2025,2026"
      LAKEHOUSE_PATH: "/app/lakehouse"
    volumes:
      - ./base-dados:/app/base-dados
      - ./lakehouse:/app/lakehouse
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ceap_network

  e3-pipeline:
    build: {context: ., dockerfile: docker/e3/Dockerfile}
    container_name: ceap_e3_pipeline
    command: python orquestracao/demo_falhas.py base
    volumes:
      - ./base-dados:/app/base-dados
      - ./lakehouse:/app/lakehouse
      - ./orquestracao/.dagster_home:/app/orquestracao/.dagster_home
    depends_on:
      # quem baixa os CSVs da Câmara para base-dados/ é o serviço de ingestão da E1/E2
      ingestion: {condition: service_completed_successfully}

  e3-dagster:
    build: {context: ., dockerfile: docker/e3/Dockerfile}
    container_name: ceap_e3_dagster
    command: sh -c "cp orquestracao/dagster.yaml $$DAGSTER_HOME/dagster.yaml && dagster dev -f orquestracao/definitions.py -h 0.0.0.0 -p 3000"
    ports: ["3000:3000"]
    volumes:
      - ./base-dados:/app/base-dados
      - ./lakehouse:/app/lakehouse
      - ./orquestracao/.dagster_home:/app/orquestracao/.dagster_home
    depends_on:
      e3-pipeline: {condition: service_completed_successfully}

  e3-painel:
    build: {context: ., dockerfile: docker/e3/Dockerfile}
    container_name: ceap_e3_painel
    command: streamlit run painel/app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    volumes:
      - ./lakehouse:/app/lakehouse
    depends_on:
      e3-pipeline: {condition: service_completed_successfully}

volumes:
  postgres_data:

networks:
  ceap_network:
    driver: bridge
