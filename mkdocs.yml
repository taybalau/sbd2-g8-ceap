site_name: Plataforma de Dados da CEAP
site_description: Plataforma de dados da Cota Parlamentar (CEAP) da 57ª Legislatura — Squad G8, SBD2 2026/2, UnB
site_author: Squad G8
site_url: https://taybalau.github.io/sbd2-g8-ceap/
repo_url: https://github.com/taybalau/sbd2-g8-ceap
repo_name: taybalau/sbd2-g8-ceap
edit_uri: edit/main/docs/
copyright: Squad G8 — Sistemas de Banco de Dados 2 (2026/2) — Universidade de Brasília

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/database
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Início: index.md
  - Como executar: como-executar.md
  - Plataforma:
      - Arquitetura: arquitetura.md
      - "E1 · Modelo de dados (OLTP)": modelo-de-dados.md
      - "E1 · Carga no OLTP": pipeline.md
      - "E2 · Lakehouse e CDC": lakehouse.md
      - "E2 · Enriquecimento societário": enriquecimento.md
      - Perguntas de gestão: consultas.md
  - Governança:
      - Decisões (ADR):
          - "ADR-0001 — Modelagem insert-only": adr/0001-modelagem-transacional-insert-only-ceap.md
          - "ADR-0002 — Ingestão e formato aberto": adr/0002-mecanismo-ingestao-e-formato-aberto.md
          - "ADR-0003 — Beneficiário final (UBO)": adr/0003-resolucao-grafo-societario-beneficiario-final.md
          - "ADR-0004 — Staging relacional vs Lakehouse direto": adr/0004-avaliacao-etl-relacional-postgres-vs-lakehouse-direto.md
          - "ADR-0005 — Modelagem dimensional e SCD": adr/0005-modelagem-dimensional-granularidade-scd-ceap.md
      - "Documento técnico da E2": PIPELINE_E2.md
      - Diário de bordo:
          - diario/index.md
          - Semana 01: diario/semana-01.md
          - Semana 02: diario/semana-02.md
          - Semana 03: diario/semana-03.md
          - Semana 04: diario/semana-04.md
          - Semana 05: diario/semana-05.md
          - Semana 06: diario/semana-06.md
          - Semana 07: diario/semana-07.md
      - Uso de IA: ia.md
  - "Release Notes (E1)": release-notes.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      # Âncoras no mesmo formato do GitHub (mantém acentos), para que links
      # internos dos documentos funcionem tanto no repositório quanto no site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/taybalau/sbd2-g8-ceap
