version: 2
seeds:
  - name: regra_subcota
    config:
      schema: silver
      column_types: {num_subcota: integer, permite_valor_negativo: boolean}
    description: >
      Regras de domínio por subcota. `permite_valor_negativo` foi derivado do perfil dos dados
      (2026-11-03): só as subcotas 40, 998 e 999 têm vlrLiquido < 0. A 996 (missão oficial, só
      créditos) apareceu num download posterior do mesmo dia e foi classificada igual. Qualquer negativo novo em
      outra subcota quebra o teste assert_negativo_somente_em_subcota_de_compensacao e exige análise.
    columns:
      - name: num_subcota
        description: "Código da subcota da CEAP."
        tests: [unique, not_null]
      - {name: grupo_despesa, description: "Grupo da subcota usado nas análises (ex.: Passagens aéreas)."}
      - {name: permite_valor_negativo, description: "Verdadeiro nas subcotas de compensação, onde valor negativo é legítimo."}
      - {name: justificativa_negativo, description: "Por que a subcota pode ter valor negativo, com a evidência."}
  - name: ruptura_publicacao
    config:
      schema: silver
      column_types: {num_subcota: integer, competencia_inicio: date}
    description: >
      Rupturas de publicação CONHECIDAS e investigadas. Os testes de salto e de subcota que some
      ignoram só o que está aqui; qualquer ruptura nova quebra o build até alguém investigar e
      registrar. A primeira ruptura encerra a janela "comparável" usada nos rankings.
    columns:
      - name: num_subcota
        description: "Subcota em que a ruptura foi observada."
        tests: [not_null]
      - {name: competencia_inicio, description: "Primeira competência afetada. A partir dela, os testes de salto ignoram a subcota."}
      - {name: descricao, description: "O que mudou na publicação."}
      - {name: evidencia, description: "Números que mostram a ruptura e a causa provável (ou a indicação de que não foi verificada)."}
