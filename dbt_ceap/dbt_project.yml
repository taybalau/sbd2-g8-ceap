name: ceap
version: "3.0.0"
config-version: 2
profile: ceap

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Meses recentes cuja prestação de contas ainda está chegando (dado atrasado).
  # Medido em 2026-11-03: com corte em set/2026, jun/2026 tinha 54% do gasto típico e
  # set/2026 apenas 7%. Com 4 meses de maturação, a última competência fechada é mai/2026.
  meses_maturacao: 4
  # SLA da Gold (docs/e3.md, seção Freshness e SLA): no máximo 26 h entre a ingestão do CSV
  # e a Gold publicada. A ingestão diária roda às 06:00; 2 h de margem para retry e reprocesso.
  sla_horas_gold: 26
  codigo_legislatura: 57

models:
  ceap:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: table
    core:
      +schema: silver
      +materialized: table
    gestao:
      +schema: gold
      +materialized: table

tests:
  ceap:
    +store_failures: true
    +schema: auditoria
