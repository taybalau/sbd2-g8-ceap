version: 2

models:
- name: fct_gasto_mensal_parlamentar
  description: >
    **Grão:** deputado × versão SCD (partido da época) × competência. 57ª Legislatura, sem lideranças.
    gasto_versao é aditivo; gasto_deputado_mes, mediana_uf_mes e desvio_deputado_mes se REPETEM nas versões
    de um mesmo mês — não some essas colunas sem antes fazer DISTINCT por (id_deputado, competencia).
    Para somar desvio por partido use desvio_alocado.
  meta:
    grao: deputado × sk_parlamentar × competência
    soma_segura:
    - gasto_versao
    - qtd_lancamentos
    - desvio_alocado
    soma_proibida:
    - gasto_deputado_mes
    - mediana_uf_mes
    - desvio_deputado_mes
  tests:
  - grao_unico:
      colunas:
      - sk_parlamentar
      - competencia
  columns:
  - name: id_deputado
    description: nuDeputadoId do deputado (sem lideranças).
    data_type: integer
  - name: sk_parlamentar
    description: Versão SCD2 do deputado (partido da época).
    data_type: varchar
  - name: nome_parlamentar
    description: Nome do deputado na versão.
    data_type: varchar
  - name: sigla_partido
    description: Partido vigente na versão (na data do gasto).
    data_type: varchar
  - name: sigla_uf
    description: UF vigente na versão.
    data_type: varchar
  - name: competencia
    description: Mês de competência (1º dia).
    data_type: date
  - name: is_competencia_fechada
    description: Mês com 4 meses de maturação.
    data_type: boolean
  - name: is_competencia_comparavel
    description: Mês dentro da janela dos rankings.
    data_type: boolean
  - name: qtd_lancamentos
    description: Lançamentos da versão no mês.
    data_type: bigint
  - name: gasto_versao
    description: 'Gasto da versão no mês (R$). Aditivo: pode ser somado.'
    data_type: decimal(38,2)
  - name: gasto_deputado_mes
    description: 'Gasto total do deputado no mês (R$). Repete-se entre versões do mesmo mês: NÃO somar.'
    data_type: decimal(38,2)
  - name: mediana_uf_mes
    description: >-
      Mediana do gasto mensal dos deputados da mesma UF no mês (R$): a referência do desvio.
      NÃO somar.
    data_type: decimal(18,4)
  - name: qtd_deputados_uf_mes
    description: Deputados da UF com gasto no mês (base da mediana).
    data_type: bigint
  - name: desvio_deputado_mes
    description: 'gasto_deputado_mes − mediana_uf_mes (R$). Repete-se entre versões: NÃO somar.'
    data_type: decimal(38,4)
  - name: z_deputado_mes
    description: >-
      Z-score robusto: (gasto − mediana da UF) ÷ (1,4826 × MAD da UF no mês). Nulo se o MAD for 0.
    data_type: double
  - name: desvio_alocado
    description: >-
      Desvio do mês rateado entre as versões pelo gasto (R$). Aditivo: é o que se soma por partido.
    data_type: decimal(18,4)
  config:
    contract:
      enforced: true
- name: mart_desvio_parlamentar
  description: >-
    **Grão:** um deputado. Ranking do desvio acumulado acima da mediana mensal da UF (competências comparáveis).
  meta:
    grao: deputado (id_deputado)
  tests:
  - grao_unico:
      colunas:
      - id_deputado
  columns:
  - name: id_deputado
    description: nuDeputadoId do deputado.
    data_type: integer
  - name: nome_parlamentar
    description: Nome do deputado (versão mais recente).
    data_type: varchar
  - name: sigla_uf
    description: UF do deputado (versão mais recente).
    data_type: varchar
  - name: partido_atual
    description: Partido da versão mais recente.
    data_type: varchar
  - name: trajetoria_partidaria
    description: 'Partidos do deputado na 57ª Legislatura, em ordem (ex.: PATRIOTA → PRD).'
    data_type: varchar
  - name: trocou_de_partido
    description: Verdadeiro se teve mais de uma versão na 57ª.
    data_type: boolean
  - name: meses_com_gasto
    description: Competências comparáveis com gasto.
    data_type: bigint
  - name: gasto_total
    description: Gasto nas competências comparáveis (R$).
    data_type: decimal(38,2)
  - name: gasto_medio_mensal
    description: Gasto médio por mês com gasto (R$).
    data_type: double
  - name: mediana_uf_mensal
    description: Média, nos mesmos meses, da mediana mensal da UF (R$).
    data_type: double
  - name: desvio_acumulado
    description: Soma mês a mês de (gasto − mediana da UF) (R$). É a medida do ranking.
    data_type: decimal(38,4)
  - name: desvio_relativo
    description: 'desvio_acumulado ÷ soma das medianas da UF (ex.: 0,33 = 33% acima).'
    data_type: double
  - name: meses_acima_mediana
    description: Meses em que o gasto passou da mediana da UF.
    data_type: bigint
  - name: z_medio
    description: Média dos z-scores robustos mensais.
    data_type: double
  - name: hhi_fornecedores
    description: Concentração em fornecedores (0 a 1; perto de 1 = poucos fornecedores).
    data_type: double
  - name: posicao_ranking
    description: Posição pelo desvio acumulado (1 = maior desvio).
    data_type: bigint
  config:
    contract:
      enforced: true
- name: mart_desvio_partido
  description: >-
    **Grão:** um partido, pela sigla vigente na data do gasto (SCD2). Inclui o comparativo com o resultado
    errado da sobrescrita.
  meta:
    grao: partido (sigla_partido)
  tests:
  - grao_unico:
      colunas:
      - sigla_partido
  columns:
  - name: sigla_partido
    description: Partido na data do gasto (SCD tipo 2).
    data_type: varchar
  - name: qtd_deputados
    description: Deputados com gasto pelo partido na janela.
    data_type: bigint
  - name: deputado_meses
    description: Pares deputado × mês com gasto pelo partido.
    data_type: bigint
  - name: gasto_total
    description: Gasto pelo partido na janela (R$).
    data_type: decimal(38,2)
  - name: desvio_acumulado
    description: Soma do desvio_alocado (R$).
    data_type: decimal(38,4)
  - name: desvio_medio_por_deputado_mes
    description: desvio_acumulado ÷ deputado_meses (R$). É a medida do gráfico de partidos.
    data_type: double
  - name: gasto_total_se_sobrescrito
    description: Gasto que o partido teria se o partido fosse sobrescrito pelo atual (SCD tipo 1) (R$).
    data_type: decimal(38,2)
  - name: desvio_acumulado_se_sobrescrito
    description: Desvio que o partido teria com a sobrescrita (R$).
    data_type: decimal(38,4)
  - name: erro_gasto_se_sobrescrito
    description: 'Diferença entre o gasto com sobrescrita e o correto (R$): o erro que o SCD2 evita.'
    data_type: decimal(38,2)
  config:
    contract:
      enforced: true
- name: mart_freshness_gold
  description: >
    **Grão:** uma linha por tabela de consumo da Gold. Freshness medida no build: horas entre a ingestão
    mais recente dos CSVs e a construção da Gold, comparadas com o SLA declarado (var sla_horas_gold).
    O painel recalcula a idade no momento da leitura.
  meta:
    grao: tabela de consumo (tabela_consumo)
    sla: Gold publicada até 26 h após a ingestão do CSV da Câmara
  tests:
  - grao_unico:
      colunas:
      - tabela_consumo
  columns:
  - name: tabela_consumo
    description: Tabela de consumo da Gold a que a medida se refere.
    data_type: varchar
  - name: ingerido_em_mais_recente
    description: Ingestão mais recente da Bronze usada no build.
    data_type: timestamp with time zone
  - name: ingerido_em_mais_antigo
    description: Ingestão mais antiga entre as partições usadas.
    data_type: timestamp with time zone
  - name: gold_construida_em
    description: Momento em que a Gold foi construída.
    data_type: timestamp with time zone
  - name: idade_horas_no_build
    description: Horas entre a ingestão mais recente e a construção da Gold.
    data_type: double
  - name: sla_horas
    description: SLA declarado (26 h).
    data_type: integer
  - name: dentro_do_sla
    description: Verdadeiro se idade_horas_no_build ≤ sla_horas.
    data_type: boolean
  - name: ultima_competencia_publicada
    description: Competência mais recente nos CSVs.
    data_type: date
  - name: ultima_competencia_fechada
    description: Competência mais recente com 4 meses de maturação.
    data_type: date
  config:
    contract:
      enforced: true
- name: mart_concentracao_parlamentar
  description: '**Grão:** deputado × subcota × fornecedor (competências fechadas).'
  meta:
    grao: deputado × num_subcota × sk_fornecedor
  tests:
  - grao_unico:
      colunas:
      - id_deputado
      - num_subcota
      - sk_fornecedor
  columns:
  - name: id_deputado
    description: nuDeputadoId do deputado.
    data_type: integer
  - name: num_subcota
    description: Subcota.
    data_type: integer
  - name: descricao_subcota
    description: Descrição da subcota.
    data_type: varchar
  - name: sk_fornecedor
    description: Fornecedor (dim_fornecedor).
    data_type: varchar
  - name: nome_fornecedor
    description: Nome do fornecedor.
    data_type: varchar
  - name: documento_fornecedor
    description: CNPJ ou CPF do fornecedor.
    data_type: varchar
  - name: qtd_lancamentos
    description: Lançamentos do deputado no fornecedor e na subcota.
    data_type: bigint
  - name: gasto_fornecedor
    description: Gasto do deputado no fornecedor e na subcota (R$).
    data_type: decimal(38,2)
  - name: gasto_categoria
    description: Gasto do deputado na subcota (R$).
    data_type: decimal(38,2)
  - name: gasto_deputado
    description: Gasto total do deputado na janela (R$).
    data_type: decimal(38,2)
  - name: participacao_na_categoria
    description: gasto_fornecedor ÷ gasto_categoria.
    data_type: double
  - name: participacao_no_deputado
    description: gasto_fornecedor ÷ gasto_deputado.
    data_type: double
  - name: participacao_categoria_no_deputado
    description: gasto_categoria ÷ gasto_deputado.
    data_type: double
  - name: excesso_categoria_vs_uf
    description: >-
      Gasto na subcota menos a mediana dos deputados da UF na mesma subcota, contando com zero quem
      não gastou nela (R$).
    data_type: decimal(38,2)
  config:
    contract:
      enforced: true
